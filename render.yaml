services:
  - type: web
    name: influancersbackend
    env: node
    plan: free
    buildCommand: |
      apt-get update && apt-get install -y python3 make g++ \
      && npm install
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: VOTE_PRICE
        value: 20
      - key: COUNTDOWN_DAYS
        value: 28
      - key: MPESA_MODE
        value: live
      - key: KCB_ENV
        value: production
      - key: KCB_BASE_URL
        value: https://api.buni.kcbgroup.com
      - key: KCB_TOKEN_ENDPOINT
        value: https://api.buni.kcbgroup.com/token
      - key: KCB_STK_ENDPOINT
        value: https://api.buni.kcbgroup.com/mm/api/request/1.0.0/stkpush
      - key: KCB_QUERY_ENDPOINT
        value: https://api.buni.kcbgroup.com/mm/api/request/1.0.0/stkpushquery
      - key: KCB_CALLBACK_URL
        value: https://influancersbackend.onrender.com/callback
      - key: CORS_ORIGINS
        value: "*"
      # ---- Secrets: set these manually in the Render dashboard (never in git) ----
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: KCB_CONSUMER_KEY
        sync: false
      - key: KCB_CONSUMER_SECRET
        sync: false
      - key: KCB_SHORTCODE
        sync: false
      - key: KCB_TILL
        sync: false
